import java.time.Instant

plugins {
    id 'base'
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.80'
    id "me.shedaniel.unified-publishing" version "0.1.13"
}

ext.ENV = System.getenv()
def isLocal = !ENV.containsKey("GITHUB_RUN_NUMBER")

version = "${mod_version}-${isLocal ? "local.${Instant.now().epochSecond}" : "build.${ENV.GITHUB_RUN_NUMBER}"}"
group = project.maven_group
base.archivesBaseName = project.archives_base_name

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

compileJava {
    options.encoding = "UTF-8"
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url "https://maven.neoforged.net/releases"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// Zależności MUSZĄ znaleźć się PRZED blokiem 'runs'
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly("maven.modrinth:iris:1.6.17+1.20.4")
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }

    client {
        if (ENV.MC_CLIENT_ARGS) {
            programArguments.addAll(ENV.MC_CLIENT_ARGS.split(' '))
        }

        jvmArguments.addAll("-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition")
        workingDirectory file('run')
    }

    server {
        programArgument("--nogui")
        workingDirectory file('run_server')
    }
}

processResources {
    def toReplace = [
            "version": project.version,
    ]

    println("[Process Resources] Replacing properties in resources: " + toReplace)

    inputs.properties toReplace
    filesMatching("META-INF/neoforge.mods.toml") {
        expand toReplace
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_author,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : project.mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

unifiedPublishing {
    project {
        releaseType = "${ENV.RELEASE_TYPE ?: 'release'}"
        gameVersions = [
                rootProject.minecraft_version
        ]
        gameLoaders = ["neoforge"]
        displayName = "$mod_name NeoForge $project.version"
        mainPublication jar

        if (ENV.CURSEFORGE_KEY) {
            curseforge {
                token = ENV.CURSEFORGE_KEY
                id = project.curseforge_id
            }
        }

        if (ENV.MODRINTH_TOKEN) {
            modrinth {
                token = ENV.MODRINTH_TOKEN
                id = project.modrinth_id
                version = "$project.version+$project.name"
            }
        }
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }

    repositories {
        if (ENV.MAVEN_TOKEN) {
            maven {
                url "https://maven.latvian.dev/releases"
                credentials {
                    username = "lat"
                    password = "${ENV.MAVEN_TOKEN}"
                }
            }
        }

        if (ENV.SAPS_TOKEN) {
            maven {
                url "https://maven.saps.dev/releases"
                credentials {
                    username = "latvian"
                    password = "${ENV.SAPS_TOKEN}"
                }
            }
        }
    }
}

afterEvaluate {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "1000"
    }
}