import java.time.Instant

plugins {
    id 'base'
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id "me.shedaniel.unified-publishing" version "0.1.13"
}

ext.ENV = System.getenv()
def isLocal = !ENV.containsKey("GITHUB_RUN_NUMBER")

version = "${mod_version}-${isLocal ? "local.${Instant.now().epochSecond}" : "build.${ENV.GITHUB_RUN_NUMBER}"}"
group = project.maven_group
base.archivesBaseName = project.archives_base_name

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

compileJava {
    options.encoding = "UTF-8"
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // UWAGA: usunięto "copyIdeResources = true".
    // Ta opcja kazała brać zasoby z katalogów IDE zamiast z build/resources/main,
    // przez co mod nie widział assets/ (sky.json, modele, itd.).

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            if (ENV.MC_CLIENT_ARGS) {
                args ENV.MC_CLIENT_ARGS.split(' ')
            }
            jvmArgs "-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run_server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
    config "${project.mod_id}.mixins.json"
}

dependencies {
    // Wersja z gradle.properties (neo_version=47.1.106).
    // Usunięto zdublowaną, zahardkodowaną linię minecraft "net.neoforged:forge:1.20.1-47.1.106".
    minecraft "net.neoforged:forge:${neo_version}"

    // Obsługa Mixinów
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def toReplace = [
            "version": project.version,
    ]

    println("[Process Resources] Replacing properties in resources: " + toReplace)

    inputs.properties toReplace

    // W 1.20.1 używany jest plik META-INF/mods.toml
    filesMatching("META-INF/mods.toml") {
        expand toReplace
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_author,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : project.mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${project.mod_id}.mixins.json"
        ])
    }
}

unifiedPublishing {
    project {
        releaseType = "${ENV.RELEASE_TYPE ?: 'release'}"
        gameVersions = [ "1.20.1" ]
        gameLoaders = ["neoforge", "forge"]
        displayName = "$mod_name NeoForge $project.version"
        mainPublication jar

        if (ENV.CURSEFORGE_KEY) {
            curseforge {
                token = ENV.CURSEFORGE_KEY
                id = project.curseforge_id
            }
        }

        if (ENV.MODRINTH_TOKEN) {
            modrinth {
                token = ENV.MODRINTH_TOKEN
                id = project.modrinth_id
                version = "$project.version+$project.name"
            }
        }
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }

    repositories {
        if (ENV.MAVEN_TOKEN) {
            maven {
                url "https://maven.latvian.dev/releases"
                credentials {
                    username = "lat"
                    password = "${ENV.MAVEN_TOKEN}"
                }
            }
        }

        if (ENV.SAPS_TOKEN) {
            maven {
                url "https://maven.saps.dev/releases"
                credentials {
                    username = "latvian"
                    password = "${ENV.SAPS_TOKEN}"
                }
            }
        }
    }
}

afterEvaluate {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "1000"
    }
}